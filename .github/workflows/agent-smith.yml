# Agent Smith: https://github.com/tupicapp/agent-smith (a proxy; everything else lives there)
name: Agent Smith
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - CI
      - Release to Development
      - Release to Production
      - Build & Deploy App
    types: [completed]
  workflow_dispatch:
    inputs:
      args:
        description: 'JSON, e.g. {"role": "developer", "ticket": "ICBT-1"}'
jobs:
  agent-smith:
    uses: tupicapp/agent-smith/.github/workflows/dispatch.yml@stable
    with:
      args: ${{ inputs.args }}
    permissions: write-all
    secrets: inherit
